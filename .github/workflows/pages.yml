name: Verify Oventure site branch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the independent static site
        uses: actions/checkout@v5
        with:
          ref: site
      - name: Verify required entry points
        run: |
          test -f index.html
          test -f enterprise/index.html
          test -f Oventure-Enterprise-Deck.pdf
